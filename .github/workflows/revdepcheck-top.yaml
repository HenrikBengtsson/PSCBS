on: [push, pull_request]

name: revdepcheck-top

jobs:
  R-CMD-check:
    if: "! contains(github.event.head_commit.message, '[ci skip]')"    

    timeout-minutes: 30
    
    runs-on: ubuntu-latest

    name: ${{ matrix.config.pkg }} (${{ matrix.config.r }}) ${{ matrix.config.label }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { r: "release", pkg: "PureCN"  , bioc: true }
          - { r: "release", pkg: "cfdnakit", bioc: true }
          - { r: "release", pkg: "jointseg" }
          - { r: "release", pkg: "EstMix"   }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      ## R CMD check
      _R_CHECK_MATRIX_DATA_: true
      _R_CHECK_CRAN_INCOMING_: false
      _R_CHECK_TESTS_NLINES_: 300
      ## Specific to futures
      R_FUTURE_RNG_ONMISUSE: error
      R_FUTURE_PLAN: ${{ matrix.config.plan }}
      NOT_CRAN: false
      
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2
      - run: tlmgr --version

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::remotes
            any::sessioninfo
            any::covr
          needs: check

      - name: Install dependencies
        run: |
          remotes::install_deps(dependencies = TRUE)
          install.packages(".", repos=NULL, type="source")
          if (identical("${{ matrix.config.bioc }}", "true")) {
            install.packages("BiocManager")
            BiocManager::install("${{ matrix.config.pkg }}", dependencies=TRUE)
          } else {
            install.packages("${{ matrix.config.pkg }}", dependencies=TRUE)
          }
        shell: Rscript {0}

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Check reverse dependency package
        run: |
          if [[ "${{ matrix.config.bioc }}" == "true" ]]; then
            url=$(Rscript -e "cat(remotes:::download_version_url('${{ matrix.config.pkg }}', version=NULL, repos=sprintf('https://bioconductor.org/packages/%s/bioc', utils:::.BioC_version_associated_with_R_version_default), type='source'))")
          else
            url=$(Rscript -e "cat(remotes:::download_version_url('${{ matrix.config.pkg }}', version=NULL, repos='https://cloud.r-project.org', type='source'))")
          fi
          wget "$url"
          R CMD check --no-manual --as-cran "$(basename "$url")"

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-revdep${{ matrix.config.pkg }}-results
          path: ${{ matrix.config.pkg }}.Rcheck
